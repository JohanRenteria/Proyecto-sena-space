<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/icono3.png">
    <title>LOG-IN - Registro</title>
    

    <!-- Fonts -->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="css/custom.css" rel="stylesheet" />

    <!-- QRCode -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

   
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card register-card">
            <div class="card-body p-0">
              <div class="row no-gutters">
                <!-- Panel izquierdo corporativo con identidad visual -->
                <div class="col-md-4 left-panel">
                  <a href="Login.html">
                    <img src="img/fondo.png" class="logo-large" alt="LOG-IN" />
                  </a>
                </div>

                <div class="col-md-8 form-panel"><!-- Formulario de registro de usuarios -->
                  <div class="p-5">
                    <div class="text-center mb-4">
                     <a href="Login.html"></a> <h1 class="h3 text-gray-900">Crear una cuenta</h1>

                      <p class="text-muted">
                        Registra tus datos para generar tu QR personal
                      </p>
                    </div>

                    <form
                      class="user"
                      id="registerForm"
                      action="register.php"
                      method="post"
                    >
                      <div class="form-group">
                        <input
                          type="text"
                          name="registerName"
                          class="form-control"
                          id="registerName"
                          placeholder="Nombre"
                          required
                        />
                      </div>

                       <div class="form-group">
                        <input
                          type="text"
                          name="registerLastName"
                          class="form-control"
                          id="registerLastName"
                          placeholder="Apellido"
                          required
                        />
                      </div>


                      <div class="form-group">
                        <input
                          type="email"
                          name="registerEmail"
                          class="form-control"
                          id="registerEmail"
                          placeholder="Correo electrónico"
                          required
                        />
                      </div>

                      <div class="form-group">
                        <input
                          type="tel"
                          name="telefono"
                          class="form-control"
                          id="telefono"
                          placeholder="Teléfono (opcional)"
                          maxlength="30"
                        />
                      </div>

                      <div class="form-group">
                        <input
                          type="password"
                          name="registerPassword"
                          class="form-control"
                          id="registerPassword"
                          placeholder="Contraseña"
                          required
                        />
                      </div>

                      <div class="form-group">
                        <input
                          type="password"
                          name="confirmPassword"
                          class="form-control"
                          id="confirmPassword"
                          placeholder="Confirmar contraseña"
                          required
                        />
                      </div>

                      <!-- DOCUMENTO -->

                      <div class="form-group">
                        <select
                          class="custom-select"
                          id="tipoDocumento"
                          name="tipo_documento"
                          required
                        >
                          <option value="" disabled selected>
                            Tipo de documento
                          </option>

                          <option value="Cédula">Cédula</option>

                          <option value="Tarjeta de identidad">
                            Tarjeta de identidad
                          </option>

                          <option value="Pasaporte">Pasaporte</option>
                        </select>

                        <div id="selectedDocumento" class="selected-box"></div>
                      </div>

                      <!-- NUMERO -->

                      <div class="form-group">
                        <input
                          type="text"
                          class="form-control"
                          id="Cedula"
                          name="cedula"
                          placeholder="Número de documento"
                          required
                        />
                      </div>

                      <!-- ROL -->

                      <div class="form-group">
                        <select
                          class="custom-select"
                          id="userType"
                          name="userType"
                          required
                        >
                          <option value="" disabled selected required>
                            Seleccione su rol
                          </option>

                          <option value="Aprendiz">Aprendiz</option>

                          <option value="Instructor">Instructor</option>

                          <option value="Seguridad">Seguridad</option>

                          <option value="Cafetería">Cafetería</option>

                          <option value="Visitante">Visitante</option>

                          <option value="Almacen">Almacen</option>

                        </select>

                        <br>

                        <!-- NÚMERO DE FICHA: solo visible para Aprendiz -->
                        <div class="form-group" id="campoFicha" style="display: none;" required>
                          <br>
                          <input
                            type="text"
                            class="form-control"
                            id="numeroFicha"
                            name="numeroFicha"
                            placeholder="Ingrese número de ficha"
                            inputmode="numeric"
                          />
                        </div>
                        <br>
                        <div id="selectedUserType" class="selected-box"></div>
                        <!--
                          ID NUMÉRICO DEL ROL:
                          Aprendiz = 1
                          Instructor = 2
                          Seguridad = 3
                          Cafetería = 4
                          Visitante = 5
                          Almacen = 6
                          Este campo oculto se llena automáticamente con el ID correspondiente al rol seleccionado en el select.
                          El valor se envía al servidor junto con el formulario
                          para que el servidor pueda validar la relación entre el nombre del rol y su ID.     

                          JavaScript coloca aquí el ID correspondiente.
                          PHP debe volver a validar esta relación antes de
                          guardar el usuario en la base de datos.
                        -->
                        <input type="hidden" id="rol_id" name="rol_id" value="" />
                      </div>

                      <button
                        type="submit"
                        class="btn btn-success btn-register btn-block"
                      >
                        <i class="fas fa-user-plus"></i>
                        Registrar cuenta
                      </button>
                    </form>

                    <!-- QR -->

                    <div id="qrContainer">
                      <h4 class="mt-4">QR Personal Generado</h4>

                      <canvas id="qrCanvas"></canvas>

                      <div class="qr-info">
                        Este QR contiene toda la información del usuario
                        registrado.
                      </div>
                    </div>

                    <hr />

                    <div class="text-center">
                      <a class="small" href="Login.html">
                        ¿Ya tienes una cuenta? Inicia sesión
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->

    <script>
      // MOSTRAR OPCION SELECCIONADA

      const userType = document.getElementById("userType");
      const selectedUserType = document.getElementById("selectedUserType");
      const campoFicha = document.getElementById("campoFicha");
      const numeroFicha = document.getElementById("numeroFicha");

      // ============================================
      // ASIGNACIÓN NUMÉRICA DE ROLES
      // ============================================
      // El HTML envía el nombre del rol y también su ID.
      // PHP debe validar nuevamente esta relación antes
      // de guardar el dato en la base de datos.
      const roles = {
        "Aprendiz": 1,
        "Instructor": 2,
        "Seguridad": 3,
        "Cafetería": 4,
        "Visitante": 5,
        "Almacen": 6
      };

      userType.addEventListener("change", function () {
        selectedUserType.style.display = "block";

        const rolId = roles[this.value] || "";

        // Guardamos temporalmente el número correspondiente al rol.
        document.getElementById("rol_id").value = rolId;

        // Mostrar el número de ficha únicamente para Aprendiz.
        if (this.value === "Aprendiz") {
          campoFicha.style.display = "block";
          numeroFicha.required = true;
        } else {
          campoFicha.style.display = "none";
          numeroFicha.required = false;
          numeroFicha.value = "";
        }

        selectedUserType.innerHTML = `<i class="fas fa-check-circle"></i>
                Rol seleccionado:
                <b>${this.value}</b>
                <span class="ml-2">(ID: ${rolId})</span>`;
      });

      const tipoDocumento = document.getElementById("tipoDocumento");
      const selectedDocumento = document.getElementById("selectedDocumento");

      tipoDocumento.addEventListener("change", function () {
        selectedDocumento.style.display = "block";

        selectedDocumento.innerHTML = `<i class="fas fa-id-card"></i>
                Documento seleccionado:
                <b>${this.value}</b>`;
      });

      document.getElementById("registerForm").addEventListener("submit", function (e) {
        const password = document.getElementById("registerPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          e.preventDefault();
          alert("Las contraseñas no coinciden.");
          return;
        }

        if (userType.value === "Aprendiz" && !numeroFicha.value.trim()) {
          e.preventDefault();
          alert("Ingresa el número de ficha para el rol Aprendiz.");
        }
      });
    </script>
  </body>
</html>
