<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="img/icono3.png">
    <title>LOG-IN - Registro</title>
    

    <!-- Fonts -->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet" />
    <link href="css/custom.css" rel="stylesheet" />

    <!-- QRCode -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

   
    <!-- Mejora accesible embebida: foco visible, tablas desplazables y menos movimiento. -->
    <style>
        :focus-visible { outline: 3px solid #f59e0b; outline-offset: 3px; }
        .prestamos-table-panel, .table-responsive, .r-panel { overflow-x: auto; overscroll-behavior-x: contain; }
        .r-table { min-width: 680px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
    <!-- Mejora funcional embebida: permite mostrar u ocultar las contraseñas desde el formulario. -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input[type="password"]').forEach(input => {
                if (input.dataset.visibilityControl === 'true') return;
                input.dataset.visibilityControl = 'true';
                const wrapper = document.createElement('div');
                wrapper.style.position = 'relative';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);
                input.style.paddingRight = '5rem';
                const label = input.labels?.[0]?.textContent.trim() || input.placeholder || 'la contraseña';
                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.textContent = 'Mostrar';
                toggle.setAttribute('aria-label', `Mostrar ${label}`);
                toggle.setAttribute('aria-pressed', 'false');
                if (input.id) toggle.setAttribute('aria-controls', input.id);
                Object.assign(toggle.style, { position: 'absolute', top: '50%', right: '.65rem', transform: 'translateY(-50%)', border: '0', background: 'transparent', color: '#245273', fontWeight: '700', cursor: 'pointer' });
                toggle.addEventListener('click', () => {
                    const visible = input.type === 'password';
                    input.type = visible ? 'text' : 'password';
                    toggle.textContent = visible ? 'Ocultar' : 'Mostrar';
                    toggle.setAttribute('aria-label', `${visible ? 'Ocultar' : 'Mostrar'} ${label}`);
                    toggle.setAttribute('aria-pressed', String(visible));
                });
                wrapper.appendChild(toggle);
            });
        });
    </script>
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card register-card">
            <div class="card-body p-0">
              <div class="row no-gutters">
                <!-- Panel izquierdo corporativo con identidad visual -->
                <div class="col-md-4 left-panel">
                  <a href="Login.html">
                    <img src="img/fondo.png" class="logo-large" alt="LOG-IN" />
                  </a>
                </div>

                <div class="col-md-8 form-panel"><!-- Formulario de registro de usuarios -->
                  <div class="p-5">
                    <div class="text-center mb-4">
                     <a href="Login.html"></a> <h1 class="h3 text-gray-900">Crear una cuenta</h1>

                      <p class="text-muted">
                        Registra tus datos para generar tu QR personal
                      </p>
                    </div>

                    <form
                      class="user"
                      id="registerForm"
                      action="register.php"
                      method="post"
                    >
                      <div class="form-group">
                        <input
                          type="text"
                          name="registerName"
                          class="form-control"
                          id="registerName"
                          placeholder="Nombre"
                          required
                        />
                      </div>

                       <div class="form-group">
                        <input
                          type="text"
                          name="registerLastName"
                          class="form-control"
                          id="registerLastName"
                          placeholder="Apellido"
                          required
                        />
                      </div>


                      <div class="form-group">
                        <input
                          type="email"
                          name="registerEmail"
                          class="form-control"
                          id="registerEmail"
                          placeholder="Correo electrónico"
                          required
                        />
                      </div>

                      <div class="form-group">
                        <input
                          type="tel"
                          name="telefono"
                          class="form-control"
                          id="telefono"
                          placeholder="Teléfono (opcional)"
                          maxlength="30"
                        />
                      </div>

                      <div class="form-group">
                        <input
                          type="password"
                          name="registerPassword"
                          class="form-control"
                          id="registerPassword"
                          placeholder="Contraseña"
                          minlength="7"
                          required
                        />
                      </div>

                      <div class="form-group">
                        <input
                          type="password"
                          name="confirmPassword"
                          class="form-control"
                          id="confirmPassword"
                          placeholder="Confirmar contraseña"
                          required
                        />
                      </div>

                      <!-- DOCUMENTO -->

                      <div class="form-group">
                        <select
                          class="custom-select"
                          id="tipoDocumento"
                          name="tipo_documento"
                          required
                        >
                          <option value="" disabled selected>
                            Tipo de documento
                          </option>

                          <option value="Cédula">Cédula</option>

                          <option value="Tarjeta de identidad">
                            Tarjeta de identidad
                          </option>

                          <option value="Pasaporte">Pasaporte</option>
                        </select>

                        <div id="selectedDocumento" class="selected-box"></div>
                      </div>

                      <!-- NUMERO -->

                      <div class="form-group">
                        <input
                          type="text"
                          class="form-control"
                          id="Cedula"
                          name="cedula"
                          placeholder="Número de documento"
                          inputmode="numeric"
                          maxlength="10"
                          pattern="[0-9]{1,10}"
                          title="Ingresa solo números, máximo 10 dígitos."
                          required
                        />
                      </div>

                      <!-- ROL -->

                      <div class="form-group">
                        <select
                          class="custom-select"
                          id="userType"
                          name="userType"
                          required
                        >
                          <option value="" disabled selected required>
                            Seleccione su rol
                          </option>

                          <option value="Aprendiz">Aprendiz</option>

                          <option value="Instructor">Instructor</option>

                          <option value="Seguridad">Seguridad</option>

                          <option value="Cafetería">Cafetería</option>

                          <option value="Visitante">Visitante</option>

                          <option value="Almacen">Almacen</option>
                          
                          <option value="Administrador">Administrador</option>

                        </select>

                        <br>

                        <!-- NÚMERO DE FICHA: solo visible para Aprendiz -->
                        <div class="form-group" id="campoFicha" style="display: none;" required>
                          <br>
                          <input
                            type="text"
                            class="form-control"
                            id="numeroFicha"
                            name="numeroFicha"
                            placeholder="Ingrese número de ficha"
                            inputmode="numeric"
                          />
                        </div>
                        <br>
                        <!--
                          ID NUMÉRICO DEL ROL:
                          Aprendiz = 1
                          Instructor = 2
                          Seguridad = 3
                          Cafetería = 4
                          Visitante = 5
                          Almacen = 6
                          Este campo oculto conserva el ID correspondiente al rol seleccionado.
                          No se envía al servidor porque no tiene atributo name.
                        -->
                        <input type="hidden" id="rol_id"  value="" />
                      </div>

                      <button
                        type="submit"
                        class="btn btn-success btn-register btn-block"
                      >
                        <i class="fas fa-user-plus"></i>
                        Registrar cuenta
                      </button>
                    </form>

                    <!-- QR -->

                    <div id="qrContainer">
                      <h4 class="mt-4">QR Personal Generado</h4>

                      <canvas id="qrCanvas"></canvas>

                      <div class="qr-info">
                        Este QR contiene toda la información del usuario
                        registrado.
                      </div>
                    </div>

                    <hr />

                    <div class="text-center">
                      <a class="small" href="Login.html">
                        ¿Ya tienes una cuenta? Inicia sesión
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->

    <script>
      // MOSTRAR OPCION SELECCIONADA

      const userType = document.getElementById("userType");
      const campoFicha = document.getElementById("campoFicha");
      const numeroFicha = document.getElementById("numeroFicha");

      // ============================================
      // ASIGNACIÓN NUMÉRICA DE ROLES
      // ============================================
      // El HTML envía el nombre del rol y también su ID.
      // PHP debe validar nuevamente esta relación antes
      // de guardar el dato en la base de datos.
      const roles = {
        "Aprendiz": 1,
        "Instructor": 2,
        "Seguridad": 3,
        "Cafetería": 4,
        "Visitante": 5,
        "Almacen": 6,
        "Administrador": 7
      };

      userType.addEventListener("change", function () {
        const rolId = roles[this.value] || "";

        // Guardamos temporalmente el número correspondiente al rol.
        document.getElementById("rol_id").value = rolId;

        // El ID del rol no se muestra; el rol seleccionado habilita la ficha solo para Aprendiz.
        if (this.value === "Aprendiz") {
          campoFicha.style.display = "block";
          numeroFicha.required = true;
        } else {
          campoFicha.style.display = "none";
          numeroFicha.required = false;
          numeroFicha.value = "";
        }
      });

      const tipoDocumento = document.getElementById("tipoDocumento");
      const selectedDocumento = document.getElementById("selectedDocumento");

      tipoDocumento.addEventListener("change", function () {
        selectedDocumento.style.display = "block";

        selectedDocumento.innerHTML = `<i class="fas fa-id-card"></i>
                Documento seleccionado:
                <b>${this.value}</b>`;
      });

      document.getElementById("registerForm").addEventListener("submit", function (e) {
        const password = document.getElementById("registerPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const documento = document.getElementById("Cedula").value;

        // Validaciones adicionales: contraseña de al menos 7 caracteres, con mayúscula,
        // minúscula y sin la secuencia 123456789; documento numérico de máximo 10 dígitos.
        if (
          password.length < 7 ||
          !/[A-Z]/.test(password) ||
          !/[a-z]/.test(password) ||
          password.includes("123456789")
        ) {
          e.preventDefault();
          alert("La contraseña debe tener más de 6 caracteres, incluir mayúsculas y minúsculas, y no contener la secuencia 123456789.");
          return;
        }

        if (!/^[0-9]{1,10}$/.test(documento) || documento.includes("123456789")) {
          e.preventDefault();
          alert("El documento debe contener solo números, máximo 10 dígitos, y no incluir la secuencia 123456789.");
          return;
        }

        if (password !== confirmPassword) {
          e.preventDefault();
          alert("Las contraseñas no coinciden.");
          return;
        }

        if (userType.value === "Aprendiz" && !numeroFicha.value.trim()) {
          e.preventDefault();
          alert("Ingresa el número de ficha para el rol Aprendiz.");
        }
      });
    </script>
  </body>
</html>
